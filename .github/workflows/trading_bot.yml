name: AAPL Live Trading Bot

on:
  schedule:
    # Cron-Syntax (UTC Zeit! US Handelszeit 15:30-22:00 CEST = 13:30-20:00 UTC)
    # Ausführung alle 15 Minuten, Montag bis Freitag (1-5) zwischen 13:00 und 20:00 UTC
    - cron: '*/15 13-20 * * 1-5'
  
  # Erlaubt es, den Bot jederzeit manuell auf GitHub im Browser zu starten
  workflow_dispatch:

jobs:
  check-signal:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v3

      - name: Python einrichten
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Dependencies installieren
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy xgboost yfinance joblib ta

      - name: Signal prüfen
        run: |
          python live_bot_cron.py